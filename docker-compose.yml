version: '3'
services:
  exportgitapp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8010 exportgitlab.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8010:8010"
    depends_on:
      - db
      - wkhtmltopdf
    networks:
      - exportgitnw
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
  static-server:
    image: joseluisq/static-web-server
    restart: unless-stopped
    volumes:
      - ./staticfiles:/staticfiles
    environment:
      - SERVER_PORT=8085
      - SERVER_ROOT=/staticfiles
      - SERVER_DIRECTORY_LISTING=true
      - SERVER_CORS_ALLOW_ORIGINS=https://export.orabis.fr,https://cdn.orabis.fr
      - SERVER_CORS_ALLOW_HEADERS=*
      - SERVER_CORS_EXPOSE_HEADERS=*
    ports:
      - "8085:8085"
    networks:
      - exportgitnw
  wkhtmltopdf:
    image: "unistra-wkhtmltopdf-arm64:latest"
    container_name: "exportgitlab_wkhtmltopdf"
    restart: unless-stopped
    ports:
      - "9005:9005"
    networks:
      - exportgitnw
  db:
    image: "postgres:12"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5433:5432"
    networks:
      - exportgitnw
    volumes:
      - exportgitlab_db:/var/lib/postgresql/data
volumes:
  exportgitlab_db:
  staticfiles:
networks:
  exportgitnw:
    external: true
